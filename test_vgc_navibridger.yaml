# Standalone evaluation configuration for a NaviBridger-trained checkpoint.
# Set checkpoint_path to the EMA checkpoint produced by the matching training run.
checkpoint_path: "logs/VGCNav/navibridger_astar_bridge/ema_latest.pth"
testdataset: 'datasets_96/scenes_117/test/'
trav_maps_path: 'datasets_96/trav_maps/'
scene_path: 'iGibson/igibson/data/g_dataset/'
test_scenes: ["Azusa_0"]
initial_pos: [1.6, 0, 1.3]
initial_view_direction: [-0.7, 0, -0.7]
obs_image_size: [98, 98]
context_size: 4
metric_waypoint_spacing: 0.045
waypoint_spacing: 1
len_traj_pred: 32
# Sample 32 candidate trajectories of 32 steps and execute only the first 16.
num_trajectory_samples: 32
execute_horizon: 16
arrive_th: 0.25
encoding_size: 256
shallow_feature_layers: [2, 5]
deep_feature_layer: 11
curvature_gate_horizon: 20
curvature_stride: 3
curvature_smoothing_window: 3
use_shallow_visual_residual: true
shallow_residual_alpha_max: 0.25
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]
cond_predict_scale: false
num_diffusion_iters: 10
floorplan_encoder: efficientnet-b0
planner_floorplan_size: [256, 256]
planner_free_thresh: 0.96
traj_per_scene: 10

# Optional evaluation-time A* heading correction.  When enabled, the camera is
# realigned only if the full-horizon A* chord is more than this many degrees
# behind the current heading.
astar_heading_realign: false
astar_heading_realign_threshold_deg: 150.0

# Legacy mode counts recovery turns as collisions, matching earlier reports.
# Use movement_only to retain only actual trajectory-movement collisions.
collision_accounting_mode: legacy
# Collision recovery direction: continuous_right (default) or random.
recovery_turn_mode: continuous_right

# NaviBridger VE-DDBM settings. A* remains enabled and is the bridge endpoint.
diffusion_mode: navibridger
use_astar_local_cond: true
# Applied only while training; inference always uses the full condition.
astar_local_cond_dropout_prob: 0.0
bridge_sigma_data: 0.5
bridge_sigma_min: 0.002
bridge_sigma_max: 10.0
bridge_rho: 7.0
bridge_guidance: 1.0
bridge_clip_denoised: true
bridge_churn_step_ratio: 0.33
