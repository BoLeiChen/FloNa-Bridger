# Add these settings to the A*-enabled DPT training configuration that you use.
# Inputs and outputs are unchanged: RGB history, floorplan, pose and the A*
# local path remain inputs; the model still emits normalized 2-D deltas and the
# caller converts them to the existing local navigation trajectory format.

diffusion_mode: navibridger
num_diffusion_iters: 10

# Global condition: keep the original final DINO layer as the navigation
# backbone and add only a bounded, current-frame shallow spatial residual.
shallow_feature_layers: [2, 5]
deep_feature_layer: 11
curvature_gate_horizon: 20
curvature_stride: 3
curvature_smoothing_window: 3
use_shallow_visual_residual: true
shallow_residual_alpha_max: 0.25

# VE DDBM parameters adapted from NaiviBridger's navibridge.yaml.
bridge_sigma_data: 0.5
bridge_sigma_min: 0.002
bridge_sigma_max: 10.0
bridge_rho: 7.0
bridge_guidance: 1.0
bridge_clip_denoised: true
bridge_churn_step_ratio: 0.33

# This controls only the duplicate UNet local condition; A* remains bridge xT.
use_astar_local_cond: true
astar_local_cond_dropout_prob: 0.0

# Training path uncertainty must be correlated across waypoints.  Curvature for
# the global encoder is always computed from the clean A* path before this noise.
path_noise_apply: true
path_noise_mode: structured
path_noise_alpha_m: 0.02
path_noise_control_points: 4
path_noise_translation_std_m: 0.01
