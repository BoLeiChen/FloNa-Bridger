name: vgcnav

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.8.20
  - pip
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.4
  - numpy=1.24.4
  - scipy=1.10.1
  - pillow=10.4.0
  - pyyaml
  - matplotlib
  - tqdm
  - tensorboard
  - pip:
      - diffusers==0.33.1
      - wandb==0.12.18
      - opencv-python==4.6.0.66
      - h5py==3.6.0
      - lmdb==1.5.1
      - efficientnet-pytorch
      - warmup-scheduler
      - einops==0.8.1
      - pyastar2d
      - pytest

# iGibson is installed from a compatible local checkout after environment creation:
#   python -m pip install -e ./iGibson
